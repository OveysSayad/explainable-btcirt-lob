project:
  name: explainable-btcirt-lob
  random_seed: 42
  timezone: Asia/Tehran
  version: "2.0.0"

data:
  raw_path: data/raw/market_data_clean_nobitex.csv
  interim_path: data/interim/btcirt_clean.parquet
  processed_path: data/processed/btcirt_features.parquet
  exchange: nobitex
  symbol: BTCIRT
  timestamp_column: timestamp
  duplicate_rule: keep_last
  use_time_grid: false
  align_to_grid: false
  chunk_size: 500000
  drop_json_columns: true
  json_columns: [data, asks, bids, last_trade]
  maximum_snapshot_age_seconds: 120

numeric:
  denominator_epsilon: 1.0e-12

features:
  weighted_obi_lambda: 0.5
  cumulative_depth_levels: [1, 2, 3, 5, 8]
  distance_levels: [1, 2, 3, 5, 8]
  observation_lags: [1, 2, 3, 5]
  time_windows_seconds: [120, 300, 600, 1200]
  lag_match_tolerance_seconds: 90
  include_time_features: true
  include_trade_features_in_primary: false
  include_observation_gap_in_primary: false

study_a:
  enabled: true
  label_type: next_observation
  epsilon_candidates:
    quantiles: [0.25, 0.30, 0.35, 0.40, 0.45]
    spread_multipliers: [0.25, 0.50, 1.00]
    use_tick_threshold: true
  primary_epsilon_method: hybrid

study_b:
  enabled: true
  label_type: next_price_change
  one_sample_per_price_run: true

study_c:
  enabled: true
  horizons:
    10:
      lower_seconds: 5
      upper_seconds: 15
    30:
      lower_seconds: 20
      upper_seconds: 40
    60:
      lower_seconds: 40
      upper_seconds: 80
  minimum_total_samples: 1000
  minimum_samples_per_class: 100
  minimum_unique_dates: 10

splitting:
  train_fraction: 0.60
  validation_fraction: 0.20
  development_test_fraction: 0.20
  split_by_complete_date: true
  target_timestamp_purging: true
  walk_forward_folds: 5

optimization:
  xgboost_trials_study_a: 50
  xgboost_trials_study_b: 30
  xgboost_trials_study_c: 20
  catboost_trials: 25
  primary_metric: macro_f1
  secondary_metric: log_loss
  early_stopping_rounds: 50

bootstrap:
  enabled: true
  unit: date
  iterations: 1000
  confidence_level: 0.95

shap:
  enabled: true
  maximum_global_sample: 10000
  maximum_local_candidates: 5000
  maximum_interaction_sample: 2000
  grouped_shap: true
  stability_analysis: true
  interaction_fallbacks: true

financial_sanity_check:
  enabled: true
  trading_fee_bps: 0.0
  slippage_bps: 0.0
  execution_delay_seconds: 0
  scenarios:
    zero_cost: {fee_bps: 0.0, slippage_bps: 0.0}
    low_cost: {fee_bps: 5.0, slippage_bps: 5.0}
    moderate_cost: {fee_bps: 15.0, slippage_bps: 10.0}

reporting:
  figure_dpi: 200
  save_parquet_predictions: true
  save_model_artifacts: true
  archive_previous_results: true
  reports_dir: reports
  models_dir: models
  logs_dir: logs

paths:
  figures: reports/figures
  tables: reports/tables
  metrics: reports/metrics
  shap: reports/shap
  models_report: reports/models

output:
  save_processed_data: true
  save_models: true
  save_figures: true
  figure_dpi: 200
  reports_dir: reports
  models_dir: models
  logs_dir: logs
