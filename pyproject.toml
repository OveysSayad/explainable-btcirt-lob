[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-btcirt-lob"
version = "1.0.0"
description = "Explainable ML for short-term BTCIRT mid-price direction using Nobitex LOB snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research Team" }]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyarrow>=14.0.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "catboost>=1.2.0",
  "shap>=0.44.0",
  "matplotlib>=3.7.0",
  "plotly>=5.18.0",
  "pyyaml>=6.0",
  "joblib>=1.3.0",
  "tqdm>=4.66.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0", "black>=23.0.0", "jupyter>=1.0.0"]

[project.scripts]
btcirt-pipeline = "src.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
